<!DOCTYPE html>
{% load static %}

<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .hero-section {
          background: linear-gradient(to right, #6a11cb, #2575fc);
          color: white;
          padding: 80px 0;
        }
        .module-card {
          transition: transform 0.3s, box-shadow 0.3s;
          border: none;
          border-radius: 15px;
          overflow: hidden;
          background: #fff;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .module-card:hover {
          transform: translateY(-10px);
          box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        .module-card .icon {
          font-size: 3rem;
          color: #2575fc;
          margin-bottom: 1rem;
        }
        .module-card h3 {
          font-size: 1.5rem;
          font-weight: bold;
          margin-bottom: 1rem;
        }
        .module-card p {
          font-size: 1rem;
          color: #666;
          margin-bottom: 1.5rem;
        }
        .module-card .btn {
          background: #2575fc;
          border: none;
          border-radius: 25px;
          padding: 0.5rem 1.5rem;
          font-size: 0.9rem;
          transition: background 0.3s;
        }
        .module-card .btn:hover {
          background: #1a5bbf;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
        }

      </style>

    {% block css %}{% endblock %}
</head>

    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">IA Generativa</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#home">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="#modules">Módulos</a></li>
                        <li class="nav-item"><a class="nav-link" href="#features">Recursos</a></li>
                        <li class="nav-item"><a class="nav-link" href="#about">Sobre Nós</a></li>
                        <li class="nav-item"><a class="nav-link" href="#contact">Contato</a></li>
                    </ul>
                    <a class="btn btn-primary ms-3" href="#">Login</a>
                </div>
            </div>
        </nav>

        <!-- Content -->
        <div class="content">{% block content %}Página Inicial{% endblock %}</div>


        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
            integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
            crossorigin="anonymous"></script>

        <script>
            let tooltipelements = document.querySelectorAll("[data-bs-toggle='tooltip']");
            tooltipelements.forEach((el) => {
                new bootstrap.Tooltip(el);
            });

        </script>
        {% block extrajs %}{% endblock %}
    </body>

</html>
