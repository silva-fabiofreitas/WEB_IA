{% extends "core/base.html" %}

{% block css %}
<style>
    .dashboard-container {
        background: #fff;
        border-radius: 15px;
        padding: 30px;
        margin: 20px auto;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 1200px;
    }
    .file-upload {
        background: #f8f9fa;
        border: 2px dashed #2575fc;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: background 0.3s, border-color 0.3s;
    }
    .file-upload:hover {
        background: #e9ecef;
        border-color: #1a5bbf;
    }
    .file-upload label {
        cursor: pointer;
    }
    .file-upload i {
        color: #2575fc;
        font-size: 2rem;
    }
    .preview-table {
        max-height: 300px;
        overflow-y: auto;
        margin-top: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
    }
    .preview-table table {
        margin-bottom: 0;
    }
    .preview-table th {
        background: #2575fc;
        color: #fff;
    }
    .preview-table td, .preview-table th {
        padding: 10px;
        text-align: center;
    }
    .instructions-input {
        margin-top: 20px;
    }
    .instructions-input textarea {
        border-radius: 10px;
        border: 2px solid #2575fc;
        padding: 10px;
        font-size: 1rem;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .instructions-input textarea:focus {
        border-color: #1a5bbf;
        box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
        outline: none;
    }
    .chart-container {
        margin-top: 30px;
        background: #fff;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    #processButton {
        background: #2575fc;
        border: none;
        border-radius: 25px;
        padding: 10px 20px;
        font-size: 1rem;
        transition: background 0.3s;
    }
    #processButton:hover {
        background: #1a5bbf;
    }
    .settings-section {
        margin-top: 20px;
    }
    .settings-section label {
        font-weight: bold;
        margin-bottom: 5px;
    }
    .settings-section input, .settings-section select {
        width: 100%;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ddd;
        margin-bottom: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <h1>Dashboard com IA</h1>

    <!-- Upload de Arquivo -->
    <div class="file-upload mb-4">
        <input type="file" id="fileInput" accept=".csv, .xls, .xlsx" class="d-none">
        <label for="fileInput" class="mb-0">
            <i class="bi bi-upload"></i>
            <p class="mt-2">Clique para fazer upload de um arquivo CSV ou XLS</p>
        </label>
    </div>

    <!-- Pré-visualização da Planilha -->
    <div class="preview-table">
        <table id="previewTable" class="table table-bordered">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Instruções para a IA -->
    <div class="instructions-input">
        <label for="instructions" class="form-label">Instruções para a IA:</label>
        <textarea id="instructions" class="form-control" rows="3" placeholder="Ex: Gere um gráfico de barras com as vendas por mês."></textarea>
    </div>

    <!-- Botão de Processar -->
    <div class="text-center mb-4">
        <button id="processButton" class="btn btn-primary">Processar com IA</button>
    </div>

    <!-- Área de Renderização de Gráficos -->
    <div class="chart-container">
        <canvas id="chart"></canvas>
    </div>
</div>
{% endblock %}

{% block extrajs %}
<script>
    // Função para ler o arquivo CSV ou XLS
    document.getElementById('fileInput').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const data = e.target.result;
                // Simulação de leitura de CSV (para XLS/XLSX, use uma biblioteca como SheetJS)
                const rows = data.split('\n').map(row => row.split(','));
                renderTable(rows);
            };
            reader.readAsText(file);
        }
    });

    // Função para renderizar a tabela de pré-visualização
    function renderTable(rows) {
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        tableHeader.innerHTML = '';
        tableBody.innerHTML = '';

        if (rows.length > 0) {
            // Cabeçalho
            rows[0].forEach(header => {
                tableHeader.innerHTML += `<th>${header}</th>`;
            });

            // Dados
            rows.slice(1).forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    tr.innerHTML += `<td>${cell}</td>`;
                });
                tableBody.appendChild(tr);
            });
        }
    }

    // Função para processar as instruções com a IA (simulação)
    document.getElementById('processButton').addEventListener('click', function () {
        const instructions = document.getElementById('instructions').value;
        alert(`Processando:\n${instructions}`);

        // Simulação de geração de gráfico
        const ctx = document.getElementById('chart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio'],
                datasets: [{
                    label: 'Vendas',
                    data: [12, 19, 3, 5, 2],
                    backgroundColor: '#2575fc',
                    borderColor: '#2575fc',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>
{% endblock %}
