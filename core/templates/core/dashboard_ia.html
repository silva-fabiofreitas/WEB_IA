{% extends "core/base.html" %}
{% load static %} 
{% block css %}
<link rel="stylesheet" href="{% static 'core/css/dashboard_ia.css' %}">
{% endblock %}


{% block content %}
<div class="dashboard-container">
    <h1>Dashboard com IA</h1>

    <!-- Upload de Arquivo -->
    <div class="file-upload mb-4">
        <input type="file" name="file" id="fileInput" accept=".csv, .xls, .xlsx" class="d-none">
        <label for="fileInput" class="mb-0">
            <i class="bi bi-upload"></i>
            <p class="mt-2">Clique para fazer upload de um arquivo CSV ou XLS</p>
        </label>
    </div>

    <!-- Salvar planilha -->
    <button class="btn btn-primary my-2" id="saveFile"><i class="bi bi-save"></i></button>
    <div id="response"></div>

    <!-- Pré-visualização da Planilha -->
    <div class="preview-table">
        <table id="previewTable" class="table table-bordered">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    

    <!-- Instruções para a IA -->
    <div class="instructions-input">
        <label for="instructions" class="form-label">Instruções para a IA:</label>
        <textarea id="instructions" class="form-control" rows="3" placeholder="Ex: Gere um gráfico de barras com as vendas por mês." required="True"></textarea>
    </div>

    <!-- Botão de Processar -->
    <div class="text-center mb-4 mt-4">
        <button id="processButton" class="btn btn-primary">Processar com IA</button>
    </div>

    <!-- Área de Renderização de Gráficos -->
    <div class="chart-container">
        <div id="chart" style="width: 100%;height:400px;"></div>
    </div>
</div>
{% endblock %}

{% block extrajs %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="{% static 'core/js/dashboard_ia.js' %}" ></script>
{% endblock %}
