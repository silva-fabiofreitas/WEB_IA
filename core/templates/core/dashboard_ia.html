<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard com IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      display: flex;
      min-height: 100vh;
      background: #fff;
    }
    .sidebar {
      width: 300px;
      background: #2c3e50;
      color: #fff;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    }
    .sidebar h3 {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .sidebar .nav {
      flex-direction: column;
    }
    .sidebar .nav-item {
      margin-bottom: 10px;
    }
    .sidebar .nav-link {
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar .nav-link:hover {
      background: #34495e;
    }
    .sidebar .nav-link i {
      transition: transform 0.3s;
    }
    .sidebar .nav-link.collapsed i {
      transform: rotate(0deg);
    }
    .sidebar .nav-link:not(.collapsed) i {
      transform: rotate(180deg);
    }
    .main-content {
      flex: 1;
      padding: 20px;
      background: #f8f9fa;
    }
    .dashboard-container {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2575fc;
      font-weight: bold;
      text-align: center;
      margin-bottom: 30px;
    }
    .file-upload {
      background: #f8f9fa;
      border: 2px dashed #2575fc;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .file-upload:hover {
      background: #e9ecef;
      border-color: #1a5bbf;
    }
    .file-upload label {
      cursor: pointer;
    }
    .file-upload i {
      color: #2575fc;
      font-size: 2rem;
    }
    .preview-table {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }
    .preview-table table {
      margin-bottom: 0;
    }
    .preview-table th {
      background: #2575fc;
      color: #fff;
    }
    .preview-table td, .preview-table th {
      padding: 10px;
      text-align: center;
    }
    .instructions-input {
      margin-top: 20px;
    }
    .instructions-input textarea {
      border-radius: 10px;
      border: 2px solid #2575fc;
      padding: 10px;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .instructions-input textarea:focus {
      border-color: #1a5bbf;
      box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
      outline: none;
    }
    .chart-container {
      margin-top: 30px;
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    #processButton {
      background: #2575fc;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      font-size: 1rem;
      transition: background 0.3s;
    }
    #processButton:hover {
      background: #1a5bbf;
    }
    .settings-section {
      margin-top: 20px;
    }
    .settings-section label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .settings-section input, .settings-section select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Histórico e Configurações</h3>

    <!-- Menu de Histórico de Conversas -->
    <div class="nav-item">
      <a class="nav-link" data-bs-toggle="collapse" href="#historyCollapse" role="button">
        <span><i class="bi bi-chat-left-text"></i> Histórico de Conversas</span>
        <i class="bi bi-chevron-down"></i>
      </a>
      <div class="collapse" id="historyCollapse">
        <div class="p-3">
          <p>Conversa 1</p>
          <p>Conversa 2</p>
          <p>Conversa 3</p>
        </div>
      </div>
    </div>

    <!-- Menu de Configurações de Gráficos -->
    <div class="nav-item">
      <a class="nav-link" data-bs-toggle="collapse" href="#settingsCollapse" role="button">
        <span><i class="bi bi-palette"></i> Configurações de Gráficos</span>
        <i class="bi bi-chevron-down"></i>
      </a>
      <div class="collapse" id="settingsCollapse">
        <div class="settings-section p-3">
          <label for="chartColor">Cor do Gráfico:</label>
          <input type="color" id="chartColor" value="#2575fc">

          <label for="fontSelect">Fonte:</label>
          <select id="fontSelect">
            <option value="Arial">Arial</option>
            <option value="Verdana">Verdana</option>
            <option value="Helvetica">Helvetica</option>
          </select>

          <label for="paletteSelect">Paleta de Cores:</label>
          <select id="paletteSelect">
            <option value="default">Padrão</option>
            <option value="pastel">Pastel</option>
            <option value="vibrant">Vibrante</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Conteúdo Principal -->
  <div class="main-content">
    <div class="dashboard-container">
      <h1>Dashboard com IA</h1>

      <!-- Upload de Arquivo -->
      <div class="file-upload mb-4">
        <input type="file" id="fileInput" accept=".csv, .xls, .xlsx" class="d-none">
        <label for="fileInput" class="mb-0">
          <i class="bi bi-upload"></i>
          <p class="mt-2">Clique para fazer upload de um arquivo CSV ou XLS</p>
        </label>
      </div>

      <!-- Pré-visualização da Planilha -->
      <div class="preview-table">
        <table id="previewTable" class="table table-bordered">
          <thead>
            <tr id="tableHeader"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Instruções para a IA -->
      <div class="instructions-input">
        <label for="instructions" class="form-label">Instruções para a IA:</label>
        <textarea id="instructions" class="form-control" rows="3" placeholder="Ex: Gere um gráfico de barras com as vendas por mês."></textarea>
      </div>

      <!-- Botão de Processar -->
      <div class="text-center mb-4">
        <button id="processButton" class="btn btn-primary">Processar com IA</button>
      </div>

      <!-- Área de Renderização de Gráficos -->
      <div class="chart-container">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Função para ler o arquivo CSV ou XLS
    document.getElementById('fileInput').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const data = e.target.result;
          // Simulação de leitura de CSV (para XLS/XLSX, use uma biblioteca como SheetJS)
          const rows = data.split('\n').map(row => row.split(','));
          renderTable(rows);
        };
        reader.readAsText(file);
      }
    });

    // Função para renderizar a tabela de pré-visualização
    function renderTable(rows) {
      const tableHeader = document.getElementById('tableHeader');
      const tableBody = document.getElementById('tableBody');
      tableHeader.innerHTML = '';
      tableBody.innerHTML = '';

      if (rows.length > 0) {
        // Cabeçalho
        rows[0].forEach(header => {
          tableHeader.innerHTML += `<th>${header}</th>`;
        });

        // Dados
        rows.slice(1).forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            tr.innerHTML += `<td>${cell}</td>`;
          });
          tableBody.appendChild(tr);
        });
      }
    }

    // Função para processar as instruções com a IA (simulação)
    document.getElementById('processButton').addEventListener('click', function () {
      const instructions = document.getElementById('instructions').value;
      alert(`Processando:\n${instructions}`);

      // Simulação de geração de gráfico
      const ctx = document.getElementById('chart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio'],
          datasets: [{
            label: 'Vendas',
            data: [12, 19, 3, 5, 2],
            backgroundColor: document.getElementById('chartColor').value,
            borderColor: '#2575fc',
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true
            }
          },
          plugins: {
            legend: {
              labels: {
                font: {
                  family: document.getElementById('fontSelect').value
                }
              }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
